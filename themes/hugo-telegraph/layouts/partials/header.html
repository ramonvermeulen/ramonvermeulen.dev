{{- $current := .RelPermalink -}}
{{- $menu := site.Menus.main -}}
<header class="flex flex-col md:flex-row justify-between items-center lg:mt-10 mt-4">
  <div class="flex justify-between items-center w-full md:w-auto" role="banner">
    <a href="/" class="text-2xl md:text-left text-center py-2"><span class="font-bold">ramonvermeulen</span>.dev</a>
    <div class="flex items-center">
      <button type="button" class="theme-toggle md:hidden cursor-pointer bg-gray-300 dark:bg-gray-400 hover:bg-gray-500 rounded-full w-8 h-8 flex items-center justify-center mr-2"
              data-theme-toggle aria-pressed="false" aria-label="Toggle theme">
        <i class="bx bxs-sun text-xl absolute text-white leading-none hidden invisible dark:block dark:visible"></i>
        <i class="bx bxs-moon text-xl absolute text-white leading-none block visible dark:hidden dark:invisible"></i>
      </button>
      <button id="menu-toggle" class="md:hidden text-2xl w-8 h-8 flex items-center justify-center leading-none" aria-label="Menu" aria-expanded="false" data-menu-toggle>
        <i class="bx bx-menu" data-menu-icon></i>
      </button>
    </div>
  </div>

  <nav id="menu" class="w-full md:w-auto font-raleway menu-panel md:flex mt-2 md:mt-0" data-menu-panel aria-hidden="true">
    <ul class="flex flex-col md:flex-row md:space-x-6 text-lg items-start md:items-center dark:text-gray-200">
      {{ range $menu }}
        {{- $isActive := or (eq $current .Page.RelPermalink) (and .Page.IsHome (eq $current "/")) -}}
        <li class="md:mb-0 mb-2 md:border-0 border-b-1">
          <a href="{{ .URL }}" class="{{ if $isActive }}font-semibold{{ end }} hover:text-gray-700 hover:underline dark:hover:text-white">{{ .Name }}</a>
        </li>
      {{ end }}
      <li class="md:mb-0 mb-2 hidden md:block">
        <button type="button" class="theme-toggle cursor-pointer bg-gray-300 dark:bg-gray-400 hover:bg-gray-500 rounded-full w-8 h-8 md:w-10 md:h-10 flex items-center justify-center"
                data-theme-toggle aria-pressed="false" aria-label="Toggle theme">
          <i class="bx bxs-sun text-xl md:text-2xl absolute text-white leading-none hidden invisible dark:block dark:visible"></i>
          <i class="bx bxs-moon text-xl md:text-2xl absolute text-white leading-none block visible dark:hidden dark:invisible"></i>
        </button>
      </li>
    </ul>
  </nav>
</header>
