{{- $theme := partialCached "theme/settings.html" . -}}
<footer class="text-gray-700 dark:text-gray-200 py-6 mt-16 border-t border-gray-300">
  <div class="flex flex-col md:flex-row justify-between items-center space-y-4 md:space-y-0">
    {{- if and $theme.sourceCodeLabel $theme.sourceCodeURL -}}
      <p class="text-sm">Source code can be found on <a href="{{ $theme.sourceCodeURL }}" target="_blank" rel="noreferrer noopener" class="font-semibold hover:underline">{{- $theme.sourceCodeLabel -}}</a>.</p>
    {{- end -}}
    <a href="{{ relLangURL "/" }}" class="text-lg font-bold">
      <span class="font-bold">{{ $theme.siteName }}</span><span class="font-normal">{{ $theme.siteDomainExtension }}</span>
    </a>
  </div>
</footer>
