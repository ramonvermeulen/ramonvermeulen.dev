{{- $title := .title -}}
{{- $titleClass := default "text-4xl sm:text-6xl font-[700] mb-4 font-ui" .titleClass -}}
{{- $eyebrow := .eyebrow -}}
<div class="max-w-3xl">
  {{ with $eyebrow }}
    <p class="text-sm font-ui text-neutral-500 dark:text-neutral-400 mb-2">
      {{ . }}
    </p>
  {{ end }}
  <h1 class="{{ $titleClass }}">{{ $title | safeHTML }}</h1>
</div>
