{{ define "main" }}
  <article class="lg:mt-8 mt-4 flex flex-1 flex-col pb-8" role="main">
    {{ partial "content/page-header.html" (dict
      "eyebrow" (.Date.Format "2 Jan 2006")
      "title" .Title
      "titleClass" "text-4xl sm:text-6xl font-[800] mb-4 font-raleway"
    ) }}
    <div class="mt-8 max-w-3xl">
      <div class="font-vollkorn text-[14px] leading-5 space-y-5">
        {{ .Content }}
      </div>
    </div>
  </article>
{{ end }}
