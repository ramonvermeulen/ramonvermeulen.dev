name: Deploy Hugo Site

on:
  pull_request:
    branches:
      - main
    paths:
      - "content/**"
      - "data/**"
      - "static/**"
      - "themes/hugo-telegraph/**"
      - "hugo.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cd_hugo.yml"
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "data/**"
      - "static/**"
      - "themes/hugo-telegraph/**"
      - "hugo.toml"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/cd_hugo.yml"
  workflow_dispatch:

env:
  SITE_BUCKET_NONPROD: "nonprod.ramonvermeulen.dev"
  SITE_BUCKET_PROD: "ramonvermeulen.dev"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set deployment target
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            echo "BASE_URL=https://${SITE_BUCKET_NONPROD}/" >> "${GITHUB_ENV}"
          else
            echo "BASE_URL=https://${SITE_BUCKET_PROD}/" >> "${GITHUB_ENV}"
          fi

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.15.0

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@6b1ee2dcc06c9b6629a5317fa0146473914d05e1 # v3.0.0
        with:
          hugo-version: 0.161.1
          extended: true

      - name: Build site
        run: hugo --baseURL "${BASE_URL}" --minify

  deploy_preview:
    name: Deploy preview
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set preview target
        shell: bash
        run: echo "BASE_URL=https://${SITE_BUCKET_NONPROD}/" >> "${GITHUB_ENV}"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.15.0

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@6b1ee2dcc06c9b6629a5317fa0146473914d05e1 # v3.0.0
        with:
          hugo-version: 0.161.1
          extended: true

      - name: Build site
        run: hugo --baseURL "${BASE_URL}" --minify

      - name: Authenticate gcloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ secrets.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Upload site to nonprod bucket
        run: |
          gcloud storage rsync ./public "gs://${SITE_BUCKET_NONPROD}" \
            --delete-unmatched-destination-objects \
            --recursive

  deploy_prod:
    name: Deploy production
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set production target
        shell: bash
        run: echo "BASE_URL=https://${SITE_BUCKET_PROD}/" >> "${GITHUB_ENV}"

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.15.0

      - name: Install dependencies
        run: npm ci --include=optional

      - name: Set up Hugo
        uses: peaceiris/actions-hugo@6b1ee2dcc06c9b6629a5317fa0146473914d05e1 # v3.0.0
        with:
          hugo-version: 0.161.1
          extended: true

      - name: Build site
        run: hugo --baseURL "${BASE_URL}" --minify

      - name: Authenticate gcloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          project_id: ${{ secrets.PROJECT_ID }}
          workload_identity_provider: ${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Upload site to production bucket
        run: |
          gcloud storage rsync ./public "gs://${SITE_BUCKET_PROD}" \
            --delete-unmatched-destination-objects \
            --recursive
