paragraphs:
  - 'I am a Software and Cloud Engineer with a strong background in [***Google Cloud Platform***](https://cloud.google.com/), currently working at [***Xebia***](https://xebia.com/). My journey at Xebia began as a Data Engineer, and my interests have steadily evolved towards Cloud Infrastructure and Software Engineering. I now focus on building scalable, reliable, and secure cloud-native platforms, applications, and custom tooling. My goal is to create solutions that are both technically sound and practical to operate.'
  - 'Before Xebia, I worked as a Software Engineer at several startups, where I was involved in nearly every aspect of IT. This gave me hands-on experience across the stack, from building front-end and mobile applications to designing and implementing back-end services and APIs.'
  - "These days, I'm deepening my expertise in cloud infrastructure, the Go programming language, and core computer science fundamentals."
